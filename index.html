       <div id="workerPage" class="form-section card">
    <h2 style="text-align:center; margin-bottom:30px; color:#333;">تسجيل عامل 🛠️</h2>
    
    <div class="form-group">
        <label>الاسم الكامل</label>
        <input id="wName" placeholder="أدخل اسمك الكامل" required>
    </div>
    
    <div class="form-group">
        <label>رقم الهاتف</label>
        <input id="wPhone" type="tel" placeholder="010xxxxxxxx" required>
    </div>
    
    <div class="form-group">
        <label>الحرفة / الوظيفة</label>
        <input id="wJob" placeholder="مثال: كهربائي، نجار، سباك..." required>
    </div>
    
    <div class="form-group">
        <label>العنوان (اختياري)</label>
        <input id="address" type="text" placeholder="المنطقة أو الحي">
    </div>
    
    <div class="form-group">
        <label>رابط الصورة (اختياري)</label>
        <input id="wImage" type="url" placeholder="https://example.com/image.jpg">
    </div>
    
    <button id="saveBtn" class="btn btn-primary">نشر البطاقة الآن</button>

    <!-- نفس الـ JavaScript الأصلي بدون تغيير -->
    <script>
        // كائن لتخزين بيانات التقييم لكل عامل
        const ratings = {};

        // عند تحميل الصفحة، استرجاع التقييمات من LocalStorage
        window.onload = function() {
            for (let key in localStorage) {
                if (key.startsWith("rating_")) {
                    const workerId = key.replace("rating_", "");
                    const data = JSON.parse(localStorage.getItem(key));
                    ratings[workerId] = data;
                }
            }
        };

        // دالة التقييم
        function rateWorker(workerId, stars) {
            if (!ratings[workerId]) {
                ratings[workerId] = { total: 0, count: 0 };
            }
            ratings[workerId].total += stars;
            ratings[workerId].count += 1;
            const avg = (ratings[workerId].total / ratings[workerId].count).toFixed(1);
            localStorage.setItem("rating_" + workerId, JSON.stringify(ratings[workerId]));
        }

        // وظائف الشريط الجانبي
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // نفس JavaScript الأصلي لـ Supabase
        document.addEventListener("DOMContentLoaded", function(){
            const SUPABASE_URL = "https://jcftfbqqhwhwbocjfpmh.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZnRmYnFxaHdod2JvY2pmcG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxOTIwMzksImV4cCI6MjA4Mjc2ODAzOX0.125BNiA9cnqe4EkEiIoKikvYzauxqhgrXK2LMEIAw5g";
            const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const workerPage = document.getElementById("workerPage");
            const clientPage = document.getElementById("clientPage");
            const workersList = document.getElementById("workersList");
            const searchInput = document.getElementById("search");

            document.getElementById("btnWorker").onclick = ()=> {
                workerPage.classList.add("active");
                clientPage.classList.remove("active");
            };

            document.getElementById("btnClient").onclick = ()=> {
                clientPage.classList.add("active");
                workerPage.classList.remove("active");
                loadWorkers();
            };

            document.getElementById("saveBtn").onclick = saveWorker;

            function getDeviceId(){
                let id = localStorage.getItem("device_id");
                if(!id){
                    id = crypto.randomUUID();
                    localStorage.setItem("device_id", id);
                }
                return id;
            }

           async function saveWorker(){
    const name = document.getElementById("wName").value.trim();
    const phone = document.getElementById("wPhone").value.trim();
    const job = document.getElementById("wJob").value.trim();
    const address = document.getElementById("address").value.trim(); // حفظ العنوان
    const image_url = document.getElementById("wImage").value.trim();
    const device_id = getDeviceId();

    if(!name || !phone || !job) return alert("من فضلك أكمل البيانات الأساسية");

    const { data: exist } = await supa.from("workers").select("*").eq("device_id", device_id);

    if(exist.length > 0){
        await supa.from("workers").update({ 
            name, 
            phone, 
            job, 
            address,  // تحديث العنوان
            image_url 
        }).eq("device_id", device_id);
    } else {
        await supa.from("workers").insert({ 
            name, 
            phone, 
            job, 
            address,  // حفظ العنوان الجديد
            image_url,
            device_id 
        });
    }

    alert("✅ تم نشر بطاقتك بنجاح مع العنوان!");
    loadWorkers();
}
            async function loadWorkers(){
                const { data } = await supa.from("workers").select("*");

                const search = searchInput.value.trim();
                const filtered = search ? data.filter(w=>w.job.includes(search)) : data;

                workersList.innerHTML = filtered.map(w => `
                    <div class="worker-card">
                        ${w.image_url ? `<img src="${w.image_url}" alt="${w.name}" style="width:60px; border-radius:50%;">` : ""}
                        <div class="worker-img">${w.image_url ? '' : '👷'}</div>
                        <div class="worker-info">
                            <strong class="worker-name">👤 ${w.name}</strong><br>
                            <div class="worker-job">🔧 ${w.job}</div>
                            <div class="worker-location">📞 ${w.phone}</div>
                            <div class="worker-location">📍 ${w.address || 'غير محدد'}</div>
                            <div class="worker-rating">
                                تقييم:
                                <span>
                                    <button class="rating-btn" onclick="rateWorker(${w.id}, 1)">1⭐</button>
                                    <button class="rating-btn" onclick="rateWorker(${w.id}, 2)">2⭐</button>
                                    <button class="rating-btn" onclick="rateWorker(${w.id}, 3)">3⭐</button>
                                    <button class="rating-btn" onclick="rateWorker(${w.id}, 4)">4⭐</button>
                                    <button class="rating-btn" onclick="rateWorker(${w.id}, 5)">5⭐</button>
                                </span>
                            </div>
                            <div class="worker-actions">
                               <a class="whatsapp-btn" href="https://wa.me/20${w.phone.replace('+', '').replace(' ', '').replace('-', '')}" target="_blank">💬 واتساب</a>

                                <a class="call-btn" href="tel:${w.phone}">📞 اتصال</a>
                            </div>
                        </div>
                    </div>
                `).join("");
            }

            searchInput.oninput = loadWorkers;
        });
    </script>
